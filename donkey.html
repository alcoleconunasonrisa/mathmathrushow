<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Math Kong - Donkeysum Professional</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * { 
            box-sizing: border-box;
            touch-action: manipulation; 
            user-select: none; 
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent; 
        }
        
        html, body { 
            width: 100%;
            height: 100%;
            margin: 0; 
            padding: 0;
            overflow: hidden; 
            background: #050510; 
            color: #00d2ff; 
            font-family: 'Fredoka', -apple-system, sans-serif;
            display: flex; 
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
        }

        .hud { 
            width: 100%;
            max-width: 900px;
            font-size: 15px; 
            padding: 8px 12px; 
            background: rgba(30, 39, 46, 0.95); 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            z-index: 10;
            border-bottom: 2px solid #1e272e;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .hud-group {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .target { color: #f9d423; font-size: 20px; font-weight: bold; text-shadow: 0 0 10px rgba(249, 212, 35, 0.5); }
        .level-tag { color: #ff3f34; font-weight: bold; }
        .lives-tag { color: #ff3f34; font-weight: bold; }
        
        .home-btn { 
            text-decoration: none; 
            font-size: 18px; 
            background: #1e272e; 
            padding: 6px 12px; 
            border-radius: 8px; 
            border: 1px solid #00d2ff; 
            color: #00d2ff; 
            transition: background 0.2s;
        }
        .home-btn:active { background: #00d2ff; color: #050510; }

        .canvas-container {
            flex: 1;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 5px;
            position: relative;
        }
        
        canvas { 
            background: #0f172a; 
            border: 2px solid #1e272e; 
            border-radius: 6px;
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.15);
            max-width: 100%; 
            max-height: 100%; 
            object-fit: contain;
            aspect-ratio: 400 / 550;
        }

        #overlay {
            position: fixed; 
            top: 0; left: 0; 
            width: 100%; height: 100%;
            background: rgba(5, 5, 16, 0.96); 
            display: flex; 
            flex-direction: column;
            justify-content: center; 
            align-items: center; 
            z-index: 200; 
            overflow-y: auto;
            padding: 20px;
        }

        .menu-title {
            color: #fbbf24;
            font-size: clamp(22px, 5vw, 32px);
            margin-bottom: 5px;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(251, 191, 36, 0.4);
        }

        .menu-subtitle {
            color: #ffffff;
            font-size: 16px;
            margin-bottom: 20px;
            text-align: center;
        }

        .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 100%; max-width: 420px; }
        .submenu-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; width: 100%; max-width: 420px; }
        
        .btn-mode { 
            padding: 14px; 
            font-size: 15px; 
            background: #1e272e; 
            color: #00d2ff; 
            border: 2px solid #00d2ff; 
            border-radius: 10px; 
            font-weight: bold; 
            cursor: pointer;
            transition: transform 0.1s, background 0.2s;
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }
        .btn-mode:active { transform: scale(0.96); background: #00d2ff; color: #050510; }

        .btn-sub { 
            padding: 12px 5px; 
            font-size: 18px; 
            background: #0a0a1a; 
            color: #f9d423; 
            border: 1.5px solid #f9d423; 
            border-radius: 8px; 
            font-weight: bold;
            cursor: pointer;
        }
        .btn-sub:active { background: #f9d423; color: #050510; }

        .btn-action { 
            padding: 16px 40px; 
            font-size: 20px; 
            background: #f9d423; 
            color: #050510; 
            border: none; 
            border-radius: 50px; 
            font-weight: bold; 
            margin-top: 20px; 
            cursor: pointer;
            box-shadow: 0 0 15px rgba(249, 212, 35, 0.4);
            transition: transform 0.1s;
        }
        .btn-action:active { transform: scale(0.95); }
        
        #touchControls { 
            display: none; 
            width: 100%; 
            max-width: 400px;
            padding: 10px 20px;
            justify-content: space-between; 
            align-items: center;
            background: rgba(10, 10, 26, 0.8);
            z-index: 10;
        }
        
        .touch-group { display: flex; gap: 15px; }
        .touch-btn { 
            width: 60px; height: 60px; 
            background: rgba(0, 210, 255, 0.25); 
            border: 2px solid #00d2ff; 
            border-radius: 50%; 
            color: white; 
            font-size: 24px; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            user-select: none;
            -webkit-user-select: none;
        }
        .touch-btn:active { background: rgba(0, 210, 255, 0.6); }
        .jump-btn { 
            width: 70px; height: 70px; 
            background: rgba(255, 63, 52, 0.35); 
            border-color: #ff3f34; 
        }
        .jump-btn:active { background: rgba(255, 63, 52, 0.7); }

        @media (max-width: 600px) {
            .hud { font-size: 13px; padding: 6px; }
            .target { font-size: 18px; }
        }
    </style>
</head>
<body>

    <div id="overlay">
        <h1 id="statusTitle" class="menu-title">MATH KONG</h1>
        <p id="statusDesc" class="menu-subtitle">Selecciona tu desafío pedagógico:</p>
        
        <div id="menuModes" class="menu-grid">
            <button class="btn-mode" onclick="setMode('SUMA')">➕ SUMAS</button>
            <button class="btn-mode" onclick="setMode('RESTA')">➖ RESTAS</button>
            <button class="btn-mode" onclick="showSubmenu('MULT')">✖️ TABLAS (X)</button>
            <button class="btn-mode" onclick="showSubmenu('DIV')">➗ DIVISIONES</button>
            <button class="btn-mode" style="grid-column: span 2;" onclick="setMode('MIX')">🔀 REPASO MIXTO (NIVELES)</button>
            <a href="main-index.html" class="btn-mode" style="grid-column: span 2; border-color: #f9d423; color: #f9d423; margin-top: 5px;">🏠 INICIO</a>
        </div>

        <div id="submenu" style="display:none; text-align: center; width: 100%; max-width: 420px;">
            <p id="submenuTitle" style="color: #f9d423; margin-bottom: 15px; font-weight: bold;">Elige la tabla:</p>
            <div class="submenu-grid" id="tableButtons"></div>
            <button class="btn-mode" style="margin-top:15px; width: 100%;" onclick="setMode(pendingMode, 'all')">TODAS LAS TABLAS</button>
            <button class="btn-mode" style="margin-top:10px; width: 100%; border-color: #ff3f34; color: #ff3f34;" onclick="backToMain()">VOLVER</button>
        </div>

        <button class="btn-action" id="mainBtn" style="display:none;" onclick="startGame()">EMPEZAR JUEGO</button>
    </div>

    <div class="hud">
        <a href="main-index.html" class="home-btn">🏠</a>
        <div class="hud-group">
            <div>NIVEL: <span id="levelNum" class="level-tag">1</span></div>
            <div>RESUELVE: <span id="equation" class="target">?</span></div>
        </div>
        <div>❤️ <span id="lives" class="lives-tag">3</span> | ⭐ <span id="score">0</span></div>
    </div>
    
    <div class="canvas-container">
        <canvas id="gameCanvas" width="400" height="550"></canvas>
    </div>

    <div id="touchControls">
        <div class="touch-group">
            <div class="touch-btn" id="btnLeft">◀</div>
            <div class="touch-btn" id="btnRight">▶</div>
        </div>
        <div class="touch-btn jump-btn" id="btnJump">▲</div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        let audioCtx;

        function initAudio() { 
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)(); 
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playSound(freq, type, duration, vol = 0.05) {
            if (!audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(vol, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(); 
                osc.stop(audioCtx.currentTime + duration);
            } catch(e) {}
        }

        // --- SISTEMA PEDAGÓGICO BOMB JACK ---
        let score = 0, lives = 3, currentLevel = 1, gameActive = false;
        let gameMode = 'SUMA', selectedTable = 'all', pendingMode = '';
        let currentTask = { q: "", a: 0 };
        let gameSpeedMultiplier = 1;
        let keys = {};
        
        // Control del tiempo de renderizado
        let lastTime = 0;

        // --- ESTRUCTURA EXACTA Y ORIGINAL DE DONKEYSUM ---
        const platforms = [
            {x: 0, y: 530, w: 400, h: 15, dir: 1}, 
            {x: 0, y: 440, w: 180, h: 10, dir: 1}, {x: 220, y: 440, w: 120, h: 10, dir: 1},
            {x: 60, y: 350, w: 120, h: 10, dir: -1}, {x: 220, y: 350, w: 180, h: 10, dir: -1},
            {x: 0, y: 260, w: 180, h: 10, dir: 1}, {x: 220, y: 260, w: 120, h: 10, dir: 1},
            {x: 60, y: 170, w: 120, h: 10, dir: -1}, {x: 220, y: 170, w: 180, h: 10, dir: -1},
            {x: 120, y: 90, w: 160, h: 10, dir: 0}
        ];

        let player = { x: 20, y: 490, w: 20, h: 28, vx: 0, vy: 0, grounded: false };
        let chests = [];
        let spawnTimer = 0;

        function setMode(mode, table = 'all') {
            gameMode = mode; selectedTable = table; initAudio();
            document.getElementById("menuModes").style.display = "none";
            document.getElementById("submenu").style.display = "none";
            document.getElementById("mainBtn").style.display = "block";
            document.getElementById("statusDesc").innerText = `Modo: ${mode} ${table!=='all'?'(Tabla '+table+')':''}`;
        }

        function showSubmenu(mode) {
            pendingMode = mode;
            document.getElementById("menuModes").style.display = "none";
            document.getElementById("submenu").style.display = "block";
            const container = document.getElementById("tableButtons");
            container.innerHTML = '';
            for(let i=1; i<=10; i++) {
                let btn = document.createElement("button");
                btn.className = "btn-sub"; btn.innerText = i;
                btn.onclick = () => setMode(mode, i);
                container.appendChild(btn);
            }
        }

        function backToMain() {
            document.getElementById("menuModes").style.display = "grid";
            document.getElementById("submenu").style.display = "none";
        }

        function startGame() {
            initAudio();
            document.getElementById("overlay").style.display = "none";
            if (currentLevel === 1) { 
                score = 0; 
                lives = 3; 
                gameSpeedMultiplier = 1;
                document.getElementById("score").innerText = "0"; 
                document.getElementById("lives").innerText = "3";
            }
            
            // Reiniciar jugador y cofres/esferas
            player = { x: 20, y: 490, w: 20, h: 28, vx: 0, vy: 0, grounded: false };
            chests = [];
            spawnTimer = 0;
            document.getElementById("levelNum").innerText = currentLevel;
            
            generateTask();
            gameActive = true; 
            
            // Inicializar tiempo base para Delta Time
            lastTime = performance.now();
            requestAnimationFrame(gameLoop);
        }

        function generateTask() {
            let op = gameMode;
            if (op === 'MIX') {
                const modes = ['SUMA', 'RESTA', 'MULT', 'DIV'];
                op = modes[Math.floor(Math.random() * modes.length)];
            }

            let n1, n2;
            if (op === 'MULT' || op === 'DIV') {
                let base = (selectedTable === 'all') ? (Math.floor(Math.random() * 10) + 1) : selectedTable;
                let factor = Math.floor(Math.random() * 10) + 1;
                
                if (op === 'MULT') {
                    currentTask = { q: `${base} x ${factor}`, a: base * factor };
                } else {
                    currentTask = { q: `${base * factor} : ${base}`, a: factor };
                }
            } else if (op === 'SUMA') {
                n1 = Math.floor(Math.random() * (10 + currentLevel * 2));
                n2 = Math.floor(Math.random() * (10 + currentLevel * 2));
                currentTask = { q: `${n1} + ${n2}`, a: n1 + n2 };
            } else { // RESTA
                n1 = Math.floor(Math.random() * (15 + currentLevel * 2)) + 5;
                n2 = Math.floor(Math.random() * n1);
                currentTask = { q: `${n1} - ${n2}`, a: n1 - n2 };
            }

            document.getElementById('equation').innerText = currentTask.q;
        }

        // --- LÓGICA ORIGINAL DE GENERACIÓN DE COFRES DONKEYSUM ---
        function spawnChest() {
            if(!gameActive || chests.length >= 6) return;
            const hasCorrect = chests.some(c => c.val === currentTask.a);
            let val;
            if (!hasCorrect && (chests.length >= 2 || Math.random() > 0.5)) {
                val = currentTask.a;
            } else {
                val = currentTask.a + (Math.floor(Math.random()*6)-3);
                if(val === currentTask.a || val < 0) val = currentTask.a + 2;
            }
            chests.push({ 
                x: 200, y: 65, r: 15, 
                vx: (Math.random() > 0.5 ? 1.6 : -1.6) * gameSpeedMultiplier, 
                vy: 0, val: val 
            });
        }

        function gameOver() {
            gameActive = false; currentLevel = 1;
            document.getElementById("overlay").style.display = "flex";
            document.getElementById("statusTitle").innerText = "¡FIN DE PARTIDA!";
            document.getElementById("menuModes").style.display = "grid";
            document.getElementById("mainBtn").style.display = "none";
            playSound(110, 'sawtooth', 0.4, 0.1);
        }

        function victoryTransition() {
            gameActive = false; currentLevel++; gameSpeedMultiplier += 0.2;
            document.getElementById("overlay").style.display = "flex";
            document.getElementById("statusTitle").innerText = "¡NIVEL SUPERADO!";
            document.getElementById("mainBtn").style.display = "block";
            playSound(880, 'sine', 0.3, 0.1);
        }

        // --- FÍSICAS Y MOTOR AJUSTADO CON DELTA TIME ---
        function update(dt) {
            if (!gameActive) return;

            // Controles del jugador
            if(keys['arrowleft'] || keys['a']) player.vx = -3.8;
            else if(keys['arrowright'] || keys['d']) player.vx = 3.8;
            else player.vx = 0;

            if((keys['arrowup'] || keys['w']) && player.grounded) {
                player.vy = -10; player.grounded = false;
                playSound(300, 'triangle', 0.08);
            }

            // Aplicar dt al movimiento y la gravedad
            player.vy += 0.5 * dt;
            player.x += player.vx * dt; 
            player.y += player.vy * dt;
            
            if (player.x < 0) player.x = 0; 
            if (player.x > 380) player.x = 380;
            if (player.y > 530 - player.h) { 
                player.y = 530 - player.h; 
                player.vy = 0; 
                player.grounded = true; 
            }

            player.grounded = false;
            platforms.forEach(p => {
                if (player.vy >= 0 && player.x + player.w > p.x && player.x < p.x + p.w &&
                    player.y + player.h >= p.y && player.y + player.h <= p.y + 12) {
                    player.y = p.y - player.h; 
                    player.vy = 0; 
                    player.grounded = true;
                }
            });

            // Actualización de Cofres/Bolas Donkeysum
            for (let i = chests.length - 1; i >= 0; i--) {
                let c = chests[i];
                if (c.vy < 4) c.vy += 0.18 * dt; 
                c.x += c.vx * dt; 
                c.y += c.vy * dt;
                let touching = false;
                
                platforms.forEach(p => {
                    let isSameLevel = Math.abs(c.y + c.r - p.y) < 12;
                    let overGap = (c.x > 180 && c.x < 220);
                    
                    if (c.vy >= 0 && isSameLevel) {
                        if ((c.x > p.x && c.x < p.x + p.w) || overGap) {
                            c.y = p.y - c.r; 
                            c.vy = 0; 
                            touching = true;
                            if(p.dir !== 0) c.vx = (1.6 * gameSpeedMultiplier) * p.dir;
                        }
                    }
                });

                if(!touching && (c.x > 385 || c.x < 15)) c.vx *= -1;
                if(c.y > 515) { chests.splice(i, 1); continue; }

                // Colisión Jugador vs Esferas Donkeysum
                if(Math.hypot(c.x - (player.x + 10), c.y - (player.y + 14)) < 22) {
                    if(c.val === currentTask.a) { 
                        score += 100; 
                        playSound(880, 'square', 0.1); 
                        document.getElementById('score').innerText = score;
                        chests.splice(i, 1);
                        
                        if (score >= currentLevel * 500) {
                            victoryTransition();
                        } else {
                            generateTask(); 
                        }
                    } else { 
                        lives--; 
                        score = Math.max(0, score - 50); 
                        playSound(110, 'sawtooth', 0.2); 
                        document.getElementById('score').innerText = score;
                        document.getElementById('lives').innerText = lives;
                        chests.splice(i, 1);
                        
                        if(lives <= 0) { 
                            gameOver(); 
                        } 
                    }
                }
            }

            // El temporizador de generación de objetos se ajusta al tiempo real
            spawnTimer += dt; 
            if(spawnTimer > (100 / gameSpeedMultiplier)) { 
                spawnChest(); 
                spawnTimer = 0; 
            }
        }

        // --- RENDERIZADO VISUAL EXPLICITO Y FIEL A DONKEYSUM ---
        function draw() {
            ctx.clearRect(0, 0, 400, 550);
            
            // Vigas Rojas Donkeysum
            ctx.fillStyle = "#ef4444"; 
            platforms.forEach(p => ctx.fillRect(p.x, p.y, p.w, p.h));
            
            // Jugador Donkeysum
            ctx.fillStyle = "#3b82f6"; ctx.fillRect(player.x, player.y+5, player.w, player.h-5);
            ctx.fillStyle = "white"; ctx.fillRect(player.x, player.y, player.w, 4);
            
            // Kong
            ctx.font = "48px Arial"; ctx.textAlign="center"; ctx.fillText("🦍", 200, 75);
            
            // Cofres/Esferas Amarillas Donkeysum
            chests.forEach(c => {
                ctx.fillStyle = "#facc15"; ctx.beginPath(); ctx.arc(c.x, c.y, c.r, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = "black"; ctx.font = "bold 15px Fredoka"; ctx.fillText(c.val, c.x, c.y+5);
            });
        }

        function gameLoop(timestamp) {
            if (gameActive) {
                // Cálculo de delta time normalizado a 60 FPS (~16.67ms por frame)
                let dt = (timestamp - lastTime) / 16.667;
                lastTime = timestamp;

                // Prevenir saltos bruscos al cambiar de pestaña o sufrir un lag spike
                if (dt > 3) dt = 1;

                update(dt);
                draw();
                requestAnimationFrame(gameLoop);
            }
        }

        // --- CONTROLES Y EVENTOS ---
        function bindTouch(id, key) {
            const el = document.getElementById(id);
            if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
                document.getElementById("touchControls").style.display = "flex";
            }
            el.addEventListener('touchstart', (e) => { e.preventDefault(); keys[key] = true; });
            el.addEventListener('touchend', (e) => { e.preventDefault(); keys[key] = false; });
            el.addEventListener('pointerdown', (e) => { e.preventDefault(); keys[key] = true; });
            el.addEventListener('pointerup', (e) => { e.preventDefault(); keys[key] = false; });
        }

        bindTouch('btnLeft', 'arrowleft');
        bindTouch('btnRight', 'arrowright');
        bindTouch('btnJump', 'arrowup');

        window.addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; });
        window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
    </script>
</body>
</html>
